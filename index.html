<!DOCTYPE html>

<html>
<head>
    <title>Abe Name Checker</title>
</head>
<body>

```
<h1>Name Checker</h1>

<label>Enter your name:</label>
<input type="text" id="name">

<button onclick="checkName()">Submit</button>

<p id="message"></p>

<script>
    function checkName() {
        let name = document.getElementById("name").value;

        if (name === "Abe") {
            document.getElementById("message").textContent = "Hi, Abe!";
        } else {
            document.getElementById("message").textContent =
                "That's not Abe. Try again!";
        }
    }
</script>
```

</body>
</html>
